name: Deploy Command Center to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # GitHub Pages must first be enabled in Settings > Pages.
      # Do not try to create/enable the Pages site from this workflow:
      # that requires an admin API permission unavailable to this runner token.
      - name: Upload static dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
