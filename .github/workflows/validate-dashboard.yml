name: Validate Command Center Dashboard

on:
  push:
    branches: [main, feature/reference-hud-fidelity]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: command-center-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate HTML, DOM bindings and application JavaScript
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const app = fs.readFileSync('app.js', 'utf8');
          if (!/^<!doctype html>/i.test(html.trimStart())) throw new Error('Missing HTML5 doctype');
          if (!/<script[^>]+src=["']app\\.js["'][^>]*><\\/script>/i.test(html)) throw new Error('External app.js is not loaded');
          const ids = [...html.matchAll(/\\bid=["']([^"']+)["']/g)].map(m => m[1]);
          const duplicates = ids.filter((id, i) => ids.indexOf(id) !== i);
          if (duplicates.length) throw new Error('Duplicate element IDs: ' + [...new Set(duplicates)].join(', '));
          const idSet = new Set(ids);
          const refs = [...app.matchAll(/ids\\(["']([^"']+)["']\\)/g)].map(m => m[1]);
          const missing = [...new Set(refs.filter(id => !idSet.has(id)))];
          if (missing.length) throw new Error('Application references missing DOM IDs: ' + missing.join(', '));
          for (const required of ['command','signals','markets','review','safety','corestate','market-watchlist','signalRows','signalDetail','reviewQueue']) {
            if (!idSet.has(required)) throw new Error('Required dashboard element missing: ' + required);
          }
          if (!app.includes('shield-latest.json') || !app.includes('api.binance.com')) throw new Error('Snapshot or public market feed is not configured');
          if (!app.includes('2 * 60 * 60 * 1000') || !app.includes('STALE SNAPSHOT')) throw new Error('Two-hour snapshot freshness warning is missing');
          if (!html.includes('LIVE EXECUTION DISABLED') || !html.includes('NO BROKER ROUTING')) throw new Error('Research-only safety labels are missing');
          console.log('HTML, app bindings, snapshot integration, freshness handling and safety checks passed.');
          NODE
          node --check app.js
      - name: Validate published snapshot contract and credential hygiene
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const snapshot = JSON.parse(fs.readFileSync('data/shield-latest.json', 'utf8'));
          if (snapshot.ok !== true || !Number.isFinite(Date.parse(snapshot.generated_at)) || !Array.isArray(snapshot.signals)) throw new Error('Invalid published snapshot contract');
          if (!Number.isFinite(snapshot.data_quality?.usable_assets)) throw new Error('Snapshot data quality is missing');
          for (const s of snapshot.signals) {
            if (!['BUY','SELL','WAIT','UNAVAILABLE'].includes(s.decision)) throw new Error('Unknown signal decision: ' + s.symbol);
            if (!Array.isArray(s.timeframes) || !Array.isArray(s.reasons) || !Array.isArray(s.warnings)) throw new Error('Incomplete signal record: ' + s.symbol);
            if (s.trade_plan !== null) throw new Error('Public snapshot must not publish trade plans');
          }
          const serialized = JSON.stringify(snapshot);
          if (/api.?key|authorization|bearer|access.?token|secret/i.test(serialized)) throw new Error('Credential-like field detected');
          if (snapshot.safety?.live_execution !== false || snapshot.safety?.entry_stop_loss_take_profit !== false) throw new Error('Research safety controls are not explicit');
          console.log('Snapshot schema, research-only contract and credential checks passed.');
          NODE
