name: Validate Command Center Dashboard

on:
  push:
    branches: [main, feature/phase2-review-queue-panel]
  pull_request:
    branches: [main, feature/golden-shield-ai-panel]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: command-center-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate HTML structure, DOM references and application JavaScript
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          if (!/^<!doctype html>/i.test(html.trimStart())) throw new Error('Missing HTML5 doctype');
          const scripts = [...html.matchAll(/<script([^>]*)>([\s\S]*?)<\/script>/gi)];
          const inlineScripts = scripts.filter(match => !/\bsrc\s*=/.test(match[1]));
          if (inlineScripts.length !== 1) throw new Error('Expected exactly one inline application script (external widgets are allowed)');
          fs.writeFileSync('/tmp/dashboard-inline.js', inlineScripts[0][2]);
          const ids = [...html.matchAll(/\bid=["']([^"']+)["']/g)].map(m => m[1]);
          const duplicates = ids.filter((id, i) => ids.indexOf(id) !== i);
          if (duplicates.length) throw new Error('Duplicate element IDs: ' + [...new Set(duplicates)].join(', '));
          const idSet = new Set(ids);
          const refs = [...html.matchAll(/\$\(['"]([^'"]+)['"]\)/g)].map(m => m[1]);
          const missing = [...new Set(refs.filter(id => !idSet.has(id)))];
          if (missing.length) throw new Error('JavaScript references missing DOM IDs: ' + missing.join(', '));
          for (const id of ['liveAsset','liveTf','marketRefresh','coinRows','signalEngine','shieldSnapshotState','shieldSnapshotUpdated','shieldSnapshotCards']) {
            if (!idSet.has(id)) throw new Error('Required dashboard element missing: ' + id);
          }
          if (!html.includes('https://data-api.binance.vision') || !html.includes('https://api.binance.com')) throw new Error('Market API fallback configuration missing');
          if (!html.includes("setLiveChart('BINANCE:BTCUSDT'")) throw new Error('Crypto signal engine is not selected by default');
          if (!html.includes("./data/shield-latest.json")) throw new Error('Golden Shield snapshot panel is not wired');
          console.log('HTML structure, DOM references, market fallback, default instrument and Shield panel checks passed.');
          NODE
          node --check /tmp/dashboard-inline.js
      - name: Confirm deployment workflow exists
        run: test -f .github/workflows/deploy-pages.yml
